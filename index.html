<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>Line Sweep Pro — Project Scheduling & Tracking</title>
  <meta name="description" content="Assign, track, monitor and set milestone dates for your team's projects." />

  <!-- PWA / iPhone home-screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Line Sweep Pro" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load Inter non-render-blocking: the app must never wait on the font host
       (offline / slow network). Renders instantly in the fallback, then swaps
       to Inter when it arrives (display=swap). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"
        media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" /></noscript>
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Slim icon rail (desktop) -->
    <nav class="rail" aria-label="Primary">
      <div class="rail__logo" title="Line Sweep Pro">
        <img src="icons/icon-192.png" alt="Line Sweep Pro" />
      </div>
      <button class="rail__btn is-active" data-nav="board" title="Boards">
        <svg viewBox="0 0 24 24"><path d="M4 5h6v14H4zM14 5h6v6h-6zM14 13h6v6h-6z"/></svg>
        <span>Boards</span>
      </button>
      <button class="rail__btn" data-nav="timeline" title="Timeline">
        <svg viewBox="0 0 24 24"><path d="M3 6h13v3H3zM3 11h9v3H3zM3 16h16v3H3z"/></svg>
        <span>Timeline</span>
      </button>
      <button class="rail__btn" data-nav="kanban" title="Kanban">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z"/></svg>
        <span>Kanban</span>
      </button>
      <button class="rail__btn" data-nav="people" title="Team">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5zM15.5 19c0-2 .6-3.4 1.7-4.2 2.4.3 3.8 1.9 3.8 4.2z"/></svg>
        <span>Team</span>
      </button>
      <button class="rail__btn" data-nav="dashboard" title="Dashboard">
        <svg viewBox="0 0 24 24"><path d="M4 13h6v7H4zM4 4h6v6H4zM14 4h6v11h-6zM14 17h6v3h-6z"/></svg>
        <span>Insights</span>
      </button>
      <button class="rail__btn" data-nav="reports" title="Reports">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 12h8M8 16h8M8 8h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Reports</span>
      </button>
      <button class="rail__btn rail__btn--gear" data-nav="settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.49 7.49 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.3 7.3 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.68 8.84a.5.5 0 00.12.64l2.03 1.58a7.49 7.49 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.14.24.42.34.66.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.12.52.02.66-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="topbar__menu" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar__title">
          <h1 id="viewTitle">Projects</h1>
          <p id="viewSubtitle" class="topbar__sub"></p>
        </div>
        <div class="topbar__search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Search projects…" autocomplete="off" />
        </div>
        <button class="btn btn--primary topbar__add" id="addProjectBtn">
          <span class="btn__plus">+</span><span class="btn__label">New Project</span>
        </button>
      </header>

      <div id="viewRoot" class="view-root"></div>
    </main>

    <!-- Mobile bottom tab bar -->
    <nav class="tabbar" aria-label="Views">
      <button class="tabbar__btn is-active" data-nav="board"><svg viewBox="0 0 24 24"><path d="M4 5h6v14H4zM14 5h6v6h-6zM14 13h6v6h-6z"/></svg><span>Board</span></button>
      <button class="tabbar__btn" data-nav="timeline"><svg viewBox="0 0 24 24"><path d="M3 6h13v3H3zM3 11h9v3H3zM3 16h16v3H3z"/></svg><span>Timeline</span></button>
      <button class="tabbar__btn tabbar__btn--fab" id="addProjectBtnMobile" aria-label="New project"><span>+</span></button>
      <button class="tabbar__btn" data-nav="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5zM15.5 19c0-2 .6-3.4 1.7-4.2 2.4.3 3.8 1.9 3.8 4.2z"/></svg><span>Team</span></button>
      <button class="tabbar__btn" data-nav="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6v7H4zM4 4h6v6H4zM14 4h6v11h-6zM14 17h6v3h-6z"/></svg><span>Insights</span></button>
    </nav>
  </div>

  <!-- Modal host -->
  <div id="modalHost" class="modal-host" hidden></div>
  <!-- Toast host -->
  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <script src="js/motion.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
